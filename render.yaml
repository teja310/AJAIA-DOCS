# Render Blueprint: one free web service that serves both the API and the built React app.
services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    # --include=dev: Vite/TypeScript are dev dependencies but are needed to build the client.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SESSION_SECRET
        generateValue: true
